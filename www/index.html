<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StreamKaro</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #09090b; color: #fafaf9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px;
      }
      .logo { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 12px 40px rgba(245, 158, 11, 0.35); }
      h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
      p { color: #a1a1aa; max-width: 420px; line-height: 1.6; font-size: 15px; }
      code { background: #27272a; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
      .bar { width: 180px; height: 4px; border-radius: 999px; background: #27272a; overflow: hidden; margin-top: 8px; }
      .bar span { display: block; height: 100%; width: 40%; border-radius: 999px; background: #f59e0b; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(450%); } }
    </style>
  </head>
  <body>
    <img class="logo" src="icon.png" alt="StreamKaro" onerror="this.style.display='none'" />
    <h1>StreamKaro</h1>
    <div class="bar"><span></span></div>
    <p>
      Ye APK ek <b>web-app shell</b> hai. Apna StreamKaro website URL set karo:
      <code>capacitor.config.ts</code> me <code>server.url</code> (ya <code>STREAMKARO_URL</code> env var) —
      phir <code>npx cap sync android</code> chala ke APK build karo.
    </p>
  </body>
</html>
